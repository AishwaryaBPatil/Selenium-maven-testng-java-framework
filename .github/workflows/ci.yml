name: Selenium CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: windows-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Project
      run: mvn clean install

    - name: Run Tests
      run: mvn test
