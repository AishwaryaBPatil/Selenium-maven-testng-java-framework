name: Selenium CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Project
      run: mvn clean test

    - name: Run Tests
      run: mvn test
      
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-output/
